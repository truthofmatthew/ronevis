plugins {
    id 'com.android.application'
//    id 'com.google.gms.google-services'

}

android {
    namespace "mt.karimi.ronevis"
    compileSdk 34

    defaultConfig {
        applicationId "matthew.truth.ronevis"
        minSdk 21
        targetSdk 34
        versionCode 43
        versionName '2.65'
        // Override to test a local store: ./gradlew assembleCafebazaarDebug -PstoreUrl=http://localhost:8787/
        buildConfigField 'String', 'STORE_BASE_URL', "\"${project.findProperty('storeUrl') ?: 'https://www.ronevis.com/'}\""

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=src/main/jni/Application.mk", "APP_PLATFORM:=android-21"
                abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'

            }
        }
    }

    // Release signing: local.properties (not in git) holds releaseKeystoreProperties=<path to keystore.properties>.
    // Without it, release builds come out unsigned.
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
    def keystorePropsPath = localProps.getProperty('releaseKeystoreProperties')
    if (keystorePropsPath) {
        def ks = new Properties()
        file(keystorePropsPath).withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }

    buildTypes {
        // Installs next to the store-signed release instead of clashing with it.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (keystorePropsPath) signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }



    buildFeatures {
        buildConfig true
    }

    flavorDimensions "market"
    productFlavors {
        cafebazaar {
            dimension "market"
            buildConfigField 'String', 'marketName', '"کافه بازار"'
            buildConfigField 'String', 'marketPackage', '"com.farsitel.bazaar"'
            buildConfigField 'String', 'marketUri', '"bazaar://details?id=matthew.truth.ronevis"'
            buildConfigField 'String', 'marketUriApp', '"bazaar://details?id=matthew.truth.ronevis"'
            buildConfigField 'String', 'marketIntent', '"android.intent.action.EDIT"'
            buildConfigField 'String', 'marketCatID', '"2"'
        }
        asr24 {
            dimension "market"
            buildConfigField 'String', 'marketName', '"کندو"'
            buildConfigField 'String', 'marketPackage', '"com.ada.market"'
            buildConfigField 'String', 'marketUri', '"cando://leave-review?id=matthew.truth.ronevis"'
            buildConfigField 'String', 'marketUriApp', '"cando://details?id=matthew.truth.ronevis"'
            buildConfigField 'String', 'marketIntent', '"android.intent.action.VIEW"'
            buildConfigField 'String', 'marketCatID', '"5"'
        }
        parshub {
            dimension "market"
            buildConfigField 'String', 'marketName', '"پارس هاب"'
            buildConfigField 'String', 'marketPackage', '"net.jhoobin.jhub"'
            buildConfigField 'String', 'marketUri', '"parshub://comment?q=matthew.truth.ronevis"'
            buildConfigField 'String', 'marketUriApp', '"parshub://search?q=matthew.truth.ronevis"'
            buildConfigField 'String', 'marketIntent', '"android.intent.action.VIEW"'
            buildConfigField 'String', 'marketCatID', '"7"'
        }
        myket {
            dimension "market"
            buildConfigField 'String', 'marketName', '"مایکت"'
            buildConfigField 'String', 'marketPackage', '"ir.mservices.market"'
            buildConfigField 'String', 'marketUri', '"myket://comment/#Intent;scheme=comment;package=matthew.truth.ronevis;refId=app;end"'
            buildConfigField 'String', 'marketUriApp', '"myket://download/#Intent;scheme=download;package=matthew.truth.ronevis;end"'
            buildConfigField 'String', 'marketIntent', '"android.intent.action.VIEW"'
            buildConfigField 'String', 'marketCatID', '"3"'
        }
        iranapps {
            dimension "market"
            buildConfigField 'String', 'marketName', '"ایران اپس"'
            buildConfigField 'String', 'marketPackage', '"ir.tgbs.android.iranapp"'
            buildConfigField 'String', 'marketUri', '"iranapps://app/matthew.truth.ronevis?a=comment&r=5"'
            buildConfigField 'String', 'marketUriApp', '"iranapps://app/matthew.truth.ronevis"'
            buildConfigField 'String', 'marketIntent', '"android.intent.action.VIEW"'
            buildConfigField 'String', 'marketCatID', '"1"'
